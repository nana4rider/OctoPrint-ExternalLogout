[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-ExternalLogout"
version = "1.2.1"
description = "Adds a header link to log out through an external identity provider."
readme = { file = "README.md", content-type = "text/markdown" }
dynamic = ["license"]
requires-python = ">=3.7, <4"
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_externallogout",
    "octoprint_externallogout.*",
]

[project.entry-points."octoprint.plugin"]
octoprint_externallogout = "octoprint_externallogout"

[project.urls]
Homepage = "https://github.com/nana4rider/OctoPrint-ExternalLogout"

[project.optional-dependencies]
develop = [
    "go-task-bin",
    "ruff",
    "pre-commit",
]
