name: Test

on:
  workflow_call:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
      - run: python -m pip install ".[develop]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q octoprint_externallogout
