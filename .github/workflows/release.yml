name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  prepare-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.version.outputs.current_version }}
      tag_exists: ${{ steps.tag_check.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: version
        run: |
          CURRENT_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - id: tag_check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.current_version }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

  release:
    runs-on: ubuntu-latest
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.tag_exists == 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Add Tag
        run: |
          git tag "${{ needs.prepare-release.outputs.current_version }}"
          git push origin "${{ needs.prepare-release.outputs.current_version }}"

      - name: Create Release to GitHub
        run: gh release create "${{ needs.prepare-release.outputs.current_version }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
